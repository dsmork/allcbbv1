// ── DAILY SEED ────────────────────────────────────────────────────────────
function dateString() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function seededRandom(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return function() {
    h ^= h << 13; h ^= h >> 17; h ^= h << 5;
    return (h >>> 0) / 4294967296;
  };
}

function pickDailyPlayers() {
  const seed = dateString();
  const rng = seededRandom(seed);
  const positions = ['PG', 'SG', 'SF', 'PF', 'C'];
  const result = {};

  positions.forEach(pos => {
    const byTier = { 1: [], 2: [], 3: [], 4: [], 5: [] };
    pool[pos].forEach(p => byTier[p.tier].push(p));

    // Pick one player per tier, shuffled by seed
    const picked = [];
    for (let t = 1; t <= 5; t++) {
      const options = byTier[t];
      if (options.length === 0) continue;
      const idx = Math.floor(rng() * options.length);
      picked.push({ ...options[idx], price: t });
    }
    // Sort $1 to $5
    result[pos] = picked.sort((a, b) => a.price - b.price);
  });
  return result;
}

// ── STATE ─────────────────────────────────────────────────────────────────
const BUDGET = 15;
const positions = ['PG', 'SG', 'SF', 'PF', 'C'];
let dailyPlayers = {};
let selections = { PG: null, SG: null, SF: null, PF: null, C: null };

// ── INIT ──────────────────────────────────────────────────────────────────
function init() {
  dailyPlayers = pickDailyPlayers();

  // Set date label
  const d = new Date();
  const label = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('daily-label').textContent = `Daily · ${label}`;
  document.getElementById('results-date').textContent = label;
  document.getElementById('daily-note').textContent = `New roster available tomorrow.`;

  buildUI();
  updateBudget();
}

function buildUI() {
  const container = document.getElementById('positions-container');
  container.innerHTML = '';

  positions.forEach(pos => {
    const players = dailyPlayers[pos];
    const block = document.createElement('div');
    block.className = 'position-block';
    block.id = `block-${pos}`;

    block.innerHTML = `
      <div class="position-header">
        <span class="position-label">${pos}</span>
        <span class="position-selected empty" id="selected-label-${pos}">No player selected</span>
      </div>
      <div class="player-options" id="options-${pos}"></div>
    `;

    const optionsDiv = block.querySelector(`#options-${pos}`);
    players.forEach(player => {
      const row = document.createElement('div');
      row.className = 'player-option';
      row.id = `option-${pos}-${player.price}`;
      row.onclick = () => selectPlayer(pos, player);

      const dots = [1,2,3,4,5].map(i =>
        `<div class="tier-dot ${i <= player.price ? 'filled' : ''}"></div>`
      ).join('');

      row.innerHTML = `
        <span class="price-tag">$${player.price}</span>
        <div class="player-info">
          <div class="player-name">${player.name}</div>
          <div class="player-school">${player.school} · ${player.era}</div>
        </div>
        <div class="tier-dots">${dots}</div>
      `;
      optionsDiv.appendChild(row);
    });

    container.appendChild(block);
  });
}

function selectPlayer(pos, player) {
  selections[pos] = player;

  // Update selected options UI
  const optionsDiv = document.getElementById(`options-${pos}`);
  optionsDiv.querySelectorAll('.player-option').forEach(el => el.classList.remove('selected'));
  document.getElementById(`option-${pos}-${player.price}`).classList.add('selected');

  // Update header label
  const label = document.getElementById(`selected-label-${pos}`);
  label.textContent = `${player.name} — $${player.price}`;
  label.classList.remove('empty');

  updateBudget();
}

function updateBudget() {
  const spent = positions.reduce((sum, pos) => sum + (selections[pos]?.price || 0), 0);
  const remaining = BUDGET - spent;
  const allPicked = positions.every(pos => selections[pos] !== null);

  const display = document.getElementById('budget-display');
  const hint = document.getElementById('budget-hint');
  const btn = document.getElementById('submit-btn');
  const spentLabel = document.getElementById('spent-label');

  display.textContent = `$${remaining}`;
  spentLabel.textContent = `$${spent} spent`;

  display.classList.remove('warning', 'perfect');
  if (remaining === 0 && allPicked) {
    display.classList.add('perfect');
    btn.disabled = false;
    hint.textContent = "Perfect. Submit your roster.";
  } else if (remaining < 0) {
    display.classList.add('warning');
    btn.disabled = true;
    hint.textContent = "Over budget — swap a player out.";
  } else if (!allPicked) {
    btn.disabled = true;
    const unpicked = positions.filter(p => !selections[p]).length;
    hint.textContent = `${unpicked} position${unpicked > 1 ? 's' : ''} remaining`;
  } else {
    // All picked but not $15
    btn.disabled = true;
    hint.textContent = remaining > 0
      ? `$${remaining} left — you need to spend it all.`
      : "Over budget — swap a player out.";
  }
}

function submitRoster() {
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = '';
  let total = 0;

  positions.forEach(pos => {
    const p = selections[pos];
    total += p.price;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="result-pos">${pos}</span></td>
      <td>
        <div class="result-name">${p.name}</div>
        <div class="result-school">${p.school} · ${p.era}</div>
      </td>
      <td class="result-price">$${p.price}</td>
    `;
    tbody.appendChild(tr);
  });

  const totalRow = document.createElement('tr');
  totalRow.innerHTML = `
    <td colspan="2" class="result-total" style="font-size:13px;color:#aaa;">Total</td>
    <td class="result-price result-total">$${total}</td>
  `;
  tbody.appendChild(totalRow);

  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
}

function resetGame() {
  selections = { PG: null, SG: null, SF: null, PF: null, C: null };
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('results-screen').style.display = 'none';
  buildUI();
  updateBudget();
}

init();
</script>
</body>
</html>
